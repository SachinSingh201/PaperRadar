[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-radar"
version = "1.0.0"
description = "Lightweight, safe AI research aggregator and daily intelligence radar"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Paper Radar Team" }]
dependencies = [
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
notify = [
    "python-telegram-bot>=21.0",
]

[project.scripts]
radar = "radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
