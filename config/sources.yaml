sources:
  # --- Paper Aggregators (Official APIs) ---
  - id: arxiv-cs-ai
    name: arXiv Computer Science & AI
    type: paper
    method: arxiv
    url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.CL+OR+cat:cs.LG+OR+cat:cs.IR+OR+cat:cs.CV+OR+cat:cs.MA+OR+cat:stat.ML&sortBy=submittedDate&sortOrder=descending&max_results=35"
    domain: export.arxiv.org
    org: arXiv
    authority_tier: 1
    terms_url: "https://arxiv.org/help/api/tou"
    enabled: true

  - id: huggingface-daily-papers
    name: Hugging Face Daily Papers
    type: paper
    method: huggingface
    url: "https://huggingface.co/api/daily_papers"
    domain: huggingface.co
    org: Hugging Face
    authority_tier: 1
    terms_url: "https://huggingface.co/terms-of-service"
    enabled: true

